<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Portal Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#0d0e12;--panel:#15171d;--panel2:#1c1f27;--line:#2a2e39;--text:#e9ebf1;--muted:#8a92a3;--accent:#ff6a1a;--accent2:#ff9a3d;--ok:#35c27a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:12px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:6px 10px;font-weight:600}
button:hover{border-color:#444a5a;background:#232733}
button.pri{background:var(--accent);border-color:var(--accent);color:#1a0b02}
button.pri:hover{background:var(--accent2)}
button.ghost{background:transparent;border-color:transparent}
button.sm{padding:3px 7px;font-size:11px}
input[type=text],input[type=number],select{background:#0f1116;border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=color]{width:42px;height:26px;border:1px solid var(--line);border-radius:6px;background:#0f1116;padding:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
#app{display:grid;grid-template-columns:260px minmax(0,1fr) 330px;grid-template-rows:48px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:13px;margin:0 8px 0 0;letter-spacing:.02em}
header h1{padding:3px 8px;border-radius:6px;outline:none;cursor:text;min-width:60px}
header h1:hover{background:#ffffff0d}
header h1:focus{background:#0f1116;box-shadow:0 0 0 1px var(--accent)}
.seg{display:inline-flex;background:#0f1116;border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 11px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sp{flex:1}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:34px;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:5px;min-width:230px;box-shadow:0 12px 40px #000a}
.menu.open .pop{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px}
.pop button:hover{background:var(--panel2)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
aside{background:var(--panel);overflow:auto;min-height:0}
#side{border-right:1px solid var(--line)}
#insp{border-left:1px solid var(--line)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;position:sticky;top:0;background:var(--panel);z-index:3;border-bottom:1px solid var(--line)}
.cat{border-bottom:1px solid var(--line)}
.cath{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;background:#181b22}
.cath:hover{background:#1d212a}
.cath.dragover,.crow.dragover{outline:1px dashed var(--accent);outline-offset:-2px}
.cname{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{color:var(--muted);font-size:10px}
.catact{display:none;gap:2px}
.cath:hover .catact{display:flex}
.catact button{padding:1px 5px;font-size:10px}
.crow{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 22px;cursor:pointer;border-left:3px solid transparent}
.crow:hover{background:#1a1d25}
.crow.on{background:#2a1a10;border-left-color:var(--accent)}
.crow .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);flex:none}
.crow .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ov{font-size:9px;color:var(--accent)}
.collapsed .cl{display:none}
main{min-width:0;min-height:0;display:flex;flex-direction:column;background:
  radial-gradient(ellipse at 50% 0,#1a1410 0,transparent 60%),var(--bg)}
.tools{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.tools label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tools input[type=range]{width:130px}
#stage{flex:1;overflow:auto;padding:22px;min-height:0}
.board{display:flex;gap:22px;align-items:flex-start;width:max-content;min-width:100%}
.board.present{background:#0b0c10;padding:30px;min-height:100%}
.col{flex:none}
.col h3{margin:0 0 10px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;gap:12px}
.col.dragover{outline:1px dashed var(--accent)}
.grid{display:flex;flex-wrap:wrap;gap:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:transparent;color:var(--muted)}
.chip.on{background:var(--accent);color:#1a0b02;border-color:var(--accent)}
figure{margin:0 0 16px;cursor:pointer;border-radius:12px;padding:3px;border:2px solid transparent;position:relative}
figure:hover{border-color:#3a3f4d}
figure.on{border-color:var(--accent);background:#ffffff08}
figure.active::after{content:"";position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
figcaption{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svgw{display:block;aspect-ratio:1}
.svgw svg{display:block;width:100%;height:100%}
table{border-collapse:collapse;width:100%;font-size:12px}
.cath.on{background:#2a1a10;box-shadow:inset 3px 0 var(--accent)}
.sw{background:#0f1116;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:240px}
.who{font-size:10.5px;color:var(--accent2);margin:6px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{position:sticky;top:-22px;background:var(--panel);text-align:left;padding:7px 8px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);z-index:2}
td{padding:3px 4px;border-bottom:1px solid #1c1f27;vertical-align:middle}
tr.on td{background:#2a1a1088}
tr.catrow td{background:#181b22;font-weight:700;color:var(--accent2);padding:6px 8px;letter-spacing:.04em}
td input,td select{background:transparent;border-color:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td .pv{width:44px;height:44px}
td.n{color:var(--muted);text-align:right;width:34px}
.hint{color:var(--muted);font-size:11px;margin:8px 2px}
.prevbox{padding:14px 14px 4px;display:flex;justify-content:center}
.prevbox .svgw{width:210px}
.pt{padding:0 14px 8px;text-align:center;color:var(--muted);font-size:11px}
.scope{padding:8px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#12141a;position:sticky;top:0;z-index:3}
.scope .seg{display:flex;width:100%}
.scope .seg button{flex:1;padding:5px 4px;font-size:11px}
.scope .seg button.on{background:var(--accent);color:#1a0b02;box-shadow:none}
.scope p{margin:6px 0 0;font-size:10.5px;color:var(--muted)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;background:var(--panel);position:sticky;top:79px;z-index:2}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:9px 8px;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane{padding:12px 14px 40px}
.pane h4{margin:14px 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent2)}
.pane h4:first-child{margin-top:2px}
.fld{display:grid;grid-template-columns:96px 1fr 52px 20px;gap:7px;align-items:center;margin:6px 0}
.fld.bool{grid-template-columns:1fr auto 20px}
.fld.color{grid-template-columns:96px 1fr 20px}
.fld .lbl{color:#c4c9d6}
.fld.ov .lbl::after{content:" ●";color:var(--accent);font-size:9px}
.fld .rs{padding:0;border:0;background:transparent;color:var(--muted);visibility:hidden;font-size:13px}
.fld.ov .rs{visibility:visible}
.fld .num{padding:3px 4px;text-align:right}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.row2 button{flex:1}
.f{margin:7px 0}
.f label{display:block;color:var(--muted);font-size:10.5px;margin-bottom:3px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#232733;border:1px solid var(--line);padding:9px 14px;border-radius:9px;display:none;z-index:99;box-shadow:0 10px 30px #000a;gap:12px;align-items:center}
#toast.show{display:flex}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:430px;max-width:94vw}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 12px;font-size:14px}
.empty{color:var(--muted);padding:40px;text-align:center}
@media(max-width:1100px){#app{grid-template-columns:200px minmax(0,1fr) 290px}}
</style>
</head>

<input type="file" id="fileIcon" accept=".svg,.png,image/svg+xml,image/png" hidden="" wfd-id="id9">

    <input type="color" id="exBgColor" value="#ffffff" style="margin-top:6px;display:none" wfd-id="id11"></div>

    <button class="pri" id="exCards">Cards em PNG (ZIP)</button>

  <p class="hint" id="exMsg"></p>
  <div class="row2"><button id="exClose">Fechar</button></div>
</dialog>

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2,d=mx-mn;if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return rgb2hex(f(0)*255,f(8)*255,f(4)*255)}
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(...A.map((v,i)=>v+(B[i]-v)*t))};

/* medição de texto para ajuste automático de tamanho */
let _mctx=null;
function textW(t,weight,ls){if(!_mctx)_mctx=document.createElement('canvas').getContext('2d');_mctx.font=`${weight} 100px Montserrat, Arial, sans-serif`;return _mctx.measureText(t).width+ls*100*t.length}
function fitSize(lines,max,wmax,weight,ls){const w=Math.max(1,...lines.map(l=>textW(l,weight,ls)));return Math.min(max,wmax/w*100)}
const splitLines=t=>String(t||'').split(/\||\n/).map(s=>s.trim()).filter(Boolean);

function palette(c){
  const [h,s,l]=rgb2hsl(...hex2rgb(c));
  return{h,mid:c,
    top:hsl2hex(h+16,Math.min(100,s+10),Math.min(72,l+14)),
    deep:hsl2hex(h-4,s,l-8),
    dark:hsl2hex(h-8,s,l-24),
    edge:hsl2hex(h+10,Math.min(100,s+8),Math.min(75,l+10)),
    hs:(dh,ss,ll)=>hsl2hex(h+dh,ss,ll)}
}

function f3d(id,fs,t,layers){
  if(t<=0)return'';
  return`<filter id="${id}" x="-20%" y="-30%" width="140%" height="175%" color-interpolation-filters="sRGB">`+
    layers.map(([dx,dy,b,c,a])=>`<feDropShadow dx="${(dx*fs*t).toFixed(2)}" dy="${(dy*fs*t).toFixed(2)}" stdDeviation="${(b*fs*t/2).toFixed(2)}" flood-color="${c}" flood-opacity="${(a*Math.min(1,t)).toFixed(2)}"/>`).join('')+'</filter>'
}
function textG(lines,cy,fs,weight,ls,fill,filt,lhk){
  const lh=(lhk||.96)*fs,y0=cy-(lines.length-1)*lh/2+.35*fs;
  return`<g${filt?` filter="url(#${filt})"`:''} font-family="Montserrat, Arial, sans-serif" font-weight="${weight}" font-size="${fs.toFixed(1)}" letter-spacing="${(ls*fs).toFixed(2)}" text-anchor="middle" fill="${fill}">`+
    lines.map((l,i)=>`<text x="500" y="${(y0+i*lh).toFixed(1)}">${esc(l)}</text>`).join('')+'</g>'
}

/* card: objeto {top,main,bottom,icon,custom}; S: estilo efetivo; o: {uid,bg,attrs,fontCss} */
function cardSvg(card,S,o={}){
  const u=o.uid||'x',P=palette(S.color),r=S.radius,k=v=>v/100;
  const sh=k(S.shadow),gl=k(S.glow),bv=k(S.bevel),gs=k(S.gloss),bd=k(S.border),t3=k(S.text3d);
  const tf=S.textColor,tfEnd=mix(tf,P.dark,.1);
  const topL=S.topOn?splitLines(card.top):[],mainL=S.mainOn?splitLines(card.main):[],botL=S.botOn?splitLines(card.bottom):[];

  return selCards().some(c=>c.style[k]!==undefined);
}

/* ===== CONTEÚDO / ESTRUTURA ===== */
function setField(id,f,v){push('f'+id+f);const c=cardById(id);if(!c)return;c[f]=v;refreshCards([id]);renderSide(true);save()}
function addCard(catId,afterId){
  push();const c={id:nid('c'),cat:catId,top:'',main:'NOVO',bottom:'',icon:'',custom:null,style:{}};
  const k=S.cards.findIndex(x=>x.id===afterId);
  if(k>=0)S.cards.splice(k+1,0,c);else{const last=S.cards.map(x=>x.cat).lastIndexOf(catId);S.cards.splice(last+1||S.cards.length,0,c)}
  const cat=S.cats.find(x=>x.id===catId);if(cat&&!cardsIn(cat).length)S.cards.push(c);
  ui.sel=[c.id];ui.active=c.id;renderAll();save();
}
function dupCards(ids){
  push();ids.forEach(id=>{const c=cardById(id);if(!c)return;const n=JSON.parse(JSON.stringify(c));n.id=nid('c');S.cards.splice(S.cards.indexOf(c)+1,0,n);ui.sel=[n.id];ui.active=n.id});
  renderAll();save();
}
function delCards(ids){
  if(!ids.length)return;const before=snap();push();
  S.cards=S.cards.filter(c=>!ids.includes(c.id));
  afterStruct();toast(`${ids.length} card(s) removido(s)`,()=>{S=JSON.parse(before);hist.pop();afterStruct()});
}
function addCat(name){push();const c={id:nid('k'),name:name||'Nova categoria',style:{}};S.cats.push(c);renderAll();save();return c}
function moveCat(id,dir){push();const i=S.cats.findIndex(c=>c.id===id),j=i+dir;if(j<0||j>=S.cats.length)return;[S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]];renderAll();save()}
function delCat(id){
  const before=snap();push();S.cards=S.cards.filter(c=>c.cat!==id);S.cats=S.cats.filter(c=>c.id!==id);
  afterStruct();toast('Categoria removida',()=>{S=JSON.parse(before);hist.pop();afterStruct()});
}
function moveCardTo(cardId,catId,beforeId){
  const c=cardById(cardId);if(!c||cardId===beforeId)return;push();
  S.cards.splice(S.cards.indexOf(c),1);c.cat=catId;
  if(beforeId){S.cards.splice(S.cards.findIndex(x=>x.id===beforeId),0,c)}else{const last=S.cards.map(x=>x.cat).lastIndexOf(catId);S.cards.splice(last+1,0,c)}
  renderAll();save();
}

/* ===== SELEÇÃO ===== */
function selectCard(id,e){
  ui.scope='sel';  /* selecionou card(s) → edição só neles, até você escolher "Todos" */
  const flat=visCards().map(c=>c.id);
  if(e&&e.shiftKey&&ui.active){const a=flat.indexOf(ui.active),b=flat.indexOf(id);ui.sel=flat.slice(Math.min(a,b),Math.max(a,b)+1)}
  else if(e&&(e.ctrlKey||e.metaKey)){ui.sel=ui.sel.includes(id)?ui.sel.filter(x=>x!==id):[...ui.sel,id];if(!ui.sel.length)ui.sel=[id]}
  else ui.sel=[id];
  ui.active=id;markSel();renderSide(true);renderInsp();
}
function markSel(){
  document.querySelectorAll('[data-id]').forEach(el=>{el.classList.toggle('on',ui.sel.includes(el.dataset.id));el.classList.toggle('active',el.dataset.id===ui.active&&ui.sel.length>1)});
}

  S.cats.filter(k=>!ui.q||cardsIn(k).some(visible)).map(k=>{
    const cs=cardsIn(k).filter(c=>!ui.q||visible(c)),col=ui.collapsed[k.id]&&!ui.q;

      <div class="cl">${cs.map(c=>`<div class="crow ${ui.sel.includes(c.id)?'on':''}" data-id="${c.id}" draggable="true"><span class="dot"></span><span class="t" data-cap="${c.id}">${esc(capt(c))}</span>${Object.keys(c.style).length?'<span class="ov">●</span>':''}</div>`).join('')}</div></div>`;

$('side').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){const id=b.dataset.cat;({addcard:()=>addCard(id),up:()=>moveCat(id,-1),down:()=>moveCat(id,1),delcat:()=>delCat(id)})[b.dataset.act]();return}
  if(e.target.id==='addCat'){const k=addCat();const el=document.querySelector(`.cname[data-cat="${k.id}"]`);el&&renameCat(el);return}
  const row=e.target.closest('.crow');if(row){selectCard(row.dataset.id,e);return}
  if(e.target.closest('[data-chev]')){const id=e.target.closest('[data-chev]').dataset.chev;ui.collapsed[id]=!ui.collapsed[id];renderSide(true);return}
  const h=e.target.closest('.cath');

});
/* filtra o palco por categoria; com sel=true também seleciona todos os cards dela */
function setFilter(id,sel){
  ui.filter=id;
  if(sel&&id!=='all'){const k=S.cats.find(c=>c.id===id),cs=cardsIn(k).filter(visible);if(cs.length){ui.sel=cs.map(c=>c.id);ui.active=cs[0].id;ui.scope='sel'}}
  renderSide(true);renderStage();renderInsp();save();
}
$('side').addEventListener('dblclick',e=>{const n=e.target.closest('.cname');if(n)renameCat(n)});
function renameCat(el){
  const k=S.cats.find(c=>c.id===el.dataset.cat);const inp=document.createElement('input');inp.type='text';inp.value=k.name;el.replaceWith(inp);inp.focus();inp.select();
  const done=ok=>{if(ok&&inp.value.trim()&&inp.value!==k.name){push();k.name=inp.value.trim();save()}renderAll()};
  inp.onblur=()=>done(true);inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){inp.value=k.name;inp.blur()}};
}
$('side').addEventListener('dragstart',e=>{const r=e.target.closest('.crow');if(r){dragId=r.dataset.id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)}});
$('side').addEventListener('dragover',e=>{if(!dragId)return;const t=e.target.closest('.crow,.cath');if(t){e.preventDefault();$('side').querySelectorAll('.dragover').forEach(x=>x.classList.remove('dragover'));t.classList.add('dragover')}});

function thumb(c,p){
  return`<figure data-id="${c.id}" class="${ui.sel.includes(c.id)?'on':''}" draggable="true" style="width:${ui.zoom}px">${svgw(c.id,p)}${ui.labels?`<figcaption data-cap="${c.id}">${esc(capt(c))}</figcaption>`:''}</figure>`;
}
function chipsHtml(){
  return`<div class="chips"><button class="chip ${ui.filter==='all'?'on':''}" data-f="all">Todas (${ui.q?visCards().length+'/':''}${S.cards.length})</button>`+
    S.cats.map(k=>`<button class="chip ${ui.filter===k.id?'on':''}" data-f="${k.id}">${esc(k.name)} (${cardsIn(k).filter(c=>!ui.q||visible(c)).length})</button>`).join('')+'</div>';

function renderStage(){
  const st=$('stage');

  if(ui.view==='board'){
    const cols=S.cats.filter(k=>cardsIn(k).some(visible));
    st.innerHTML=chipsHtml()+(cols.length?`<div class="board${ui.present?' present':''}" id="board">`+cols.map(k=>`<section class="col" data-cat="${k.id}"><h3><span>${esc(k.name)}</span><span>${cardsIn(k).filter(visible).length}</span></h3>${cardsIn(k).filter(visible).map(c=>thumb(c,'b')).join('')}</section>`).join('')+'</div>':'<div class="empty">Nenhum card encontrado.</div>');

  }

}

const TCOLS=['cat','top','main','bottom','side','icon'];
function renderTable(){
  const iconOpts=c=>`<option value="">— nenhum —</option>`+Object.entries(ICONS).map(([k,v])=>`<option value="${k}" ${c.icon===k?'selected':''}>${v.n}</option>`).join('')+(c.custom?`<option value="" disabled>(ícone próprio)</option>`:'');

    rows+=`<tr class="catrow"><td colspan="9">${esc(k.name)} <button class="sm ghost" data-addrow="${k.id}">＋ card</button></td></tr>`;

      n++;
      rows+=`<tr data-id="${c.id}" class="${ui.sel.includes(c.id)?'on':''}"><td class="n">${n}</td>
       <td style="width:54px">${svgw(c.id,'t').replace('class="svgw"','class="svgw pv"')}</td>

  const el=e.target.closest('[data-f]');if(!el||!el.closest('#tbl'))return;
  const id=el.closest('tr').dataset.id;setField(id,el.dataset.f,el.value);
  if(el.dataset.f==='cat'||el.dataset.f==='icon'){renderInsp();if(el.dataset.f==='cat')renderSide(true)}
});

$('stage').addEventListener('click',e=>{
  const a=e.target.closest('[data-addrow]');if(a){addCard(a.dataset.addrow);return}
  const r=e.target.closest('[data-ra]');if(r){const id=r.closest('tr').dataset.id;r.dataset.ra==='dup'?dupCards([id]):delCards([id])}
});
$('stage').addEventListener('keydown',e=>{
  const el=e.target.closest('#tbl input[data-f]');if(!el)return;
  if(['Enter','ArrowDown','ArrowUp'].includes(e.key)&&!e.shiftKey){
    const rows=[...document.querySelectorAll('#tbl tbody tr[data-id]')],i=rows.indexOf(el.closest('tr')),j=e.key==='ArrowUp'?i-1:i+1;
    if(rows[j]){e.preventDefault();rows[j].querySelector(`[data-f="${el.dataset.f}"]`).focus()}
  }
});
$('stage').addEventListener('paste',e=>{
  const el=e.target.closest('#tbl [data-f]');if(!el)return;
  const t=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(t.trim()))return;
  e.preventDefault();
  const grid=t.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(r=>r.split('\t'));
  const rows=[...document.querySelectorAll('#tbl tbody tr[data-id]')];let ri=rows.indexOf(el.closest('tr'));const ci=TCOLS.indexOf(el.dataset.f);
  push();
  grid.forEach((line,gi)=>{
    let tr=rows[ri+gi],c=tr&&cardById(tr.dataset.id);
    if(!c){const last=cardById(rows[rows.length-1].dataset.id);c={id:nid('c'),cat:last.cat,top:'',main:'',bottom:'',icon:'',custom:null,style:{}};S.cards.push(c)}
    line.forEach((val,vi)=>{
      const f=TCOLS[ci+vi];if(!f)return;val=val.trim();
      if(f==='cat'){let k=S.cats.find(x=>x.name.toLowerCase()===val.toLowerCase());if(!k&&val){k={id:nid('k'),name:val,style:{}};S.cats.push(k)}if(k)c.cat=k.id}
      else if(f==='icon'){const key=Object.keys(ICONS).find(x=>x===val.toLowerCase()||ICONS[x].n.toLowerCase()===val.toLowerCase());c.icon=key||''}
      else c[f]=val;
    });
  });
  renderAll();save();toast('Colado da planilha');
});

/* ===== EXPORTAÇÃO ===== */
let _fc=null;
async function fontCss(){
  if(_fc!==null)return _fc;
  try{
    const css=await(await fetch('https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&display=swap')).text();
    const blocks=css.match(/\/\*[^*]*\*\/\s*@font-face\s*\{[^}]*\}/g)||[];let out='';
    for(const b of blocks.filter(b=>/\/\*\s*latin(-ext)?\s*\*\//.test(b))){
      const m=b.match(/url\(([^)]+)\)/);const buf=new Uint8Array(await(await fetch(m[1])).arrayBuffer());
      let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode(...buf.subarray(i,i+8192));
      out+=b.replace(/\/\*[^*]*\*\//,'').replace(m[0],`url(data:font/woff2;base64,${btoa(bin)})`);
    }
    _fc=out;
  }catch(e){_fc=''}
  return _fc;
}
function svgToPng(svg,w,h){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'})),img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(Error('toBlob')),'image/png')};
    img.onerror=()=>rej(Error('Falha ao renderizar SVG'));img.src=url;
  });
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'card';
function exBg(){const v=$('exBg').value;return v==='white'?'#ffffff':v==='dark'?'#0d0e12':v==='custom'?$('exBgColor').value:null}

  if(!fc)$('exMsg').textContent='Aviso: não consegui baixar a fonte Montserrat; o PNG pode sair com fonte padrão.';
  const zip=list.length>1?new JSZip():null;let i=0;

$('exBoard').onclick=async()=>{

  });
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><style>${fc}</style>${bg?`<rect width="${W}" height="${H}" fill="${bg}"/>`:''}${inner}</svg>`;
  $('exMsg').textContent='Renderizando prancha…';
  try{download(await svgToPng(svg,W,H),'prancha_media_portal.png');$('exMsg').textContent=`Prancha ${W}×${H}px exportada.`}catch(err){$('exMsg').textContent='Erro: '+err.message}

/* ===== PROJETO: JSON / TABELA ===== */
function importRows(rows){
  const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  const pick=(r,names)=>{for(const k of Object.keys(r)){if(names.includes(norm(k)))return String(r[k]??'').trim()}return''};
  const cats=[],cards=[];
  rows.forEach(r=>{
    const cat=pick(r,['categoria','grupo'])||'Geral',top=pick(r,['topo','texto1','pequeno','textopequeno']),main=pick(r,['principal','texto2','textoprincipal']).replace(/\n/g,'|'),bottom=pick(r,['rodape','texto3','descricao']),side=pick(r,['lateral','textolateral']),ic=pick(r,['icone','icone1','iconeprincipal']).toLowerCase();
    if(!top&&!main&&!bottom&&!side)return;
    let k=cats.find(x=>x.name===cat);if(!k){k={id:nid('k'),name:cat,style:{}};cats.push(k)}
    const icon=Object.keys(ICONS).find(x=>x===ic||ICONS[x].n.toLowerCase()===ic)||'';
    cards.push({id:nid('c'),cat:k.id,top,main,bottom,side,icon,custom:null,style:{}});
  });
  return{cats,cards};
}
async function handleTable(f){
  if(typeof XLSX==='undefined'){toast('Biblioteca XLSX não carregou (sem internet?)');return}
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets['EDITAR']||wb.Sheets[wb.SheetNames[0]];
  const res=importRows(XLSX.utils.sheet_to_json(ws,{defval:''}));
  if(!res.cards.length){toast('Nenhuma linha reconhecida (colunas: Categoria, Topo, Principal, Rodapé, Ícone)');return}
  push();
  /* mantém estilos de categorias com o mesmo nome; casa cards pela ordem dentro da categoria */
  res.cats.forEach(k=>{const old=S.cats.find(o=>o.name===k.name);if(old){k.style=old.style;const oldCards=cardsIn(old);res.cards.filter(c=>c.cat===k.id).forEach((c,i)=>{if(oldCards[i])c.style=oldCards[i].style;if(oldCards[i]&&!c.icon)c.icon=oldCards[i].icon;if(oldCards[i])c.custom=oldCards[i].custom})}});
  S.cats=res.cats;S.cards=res.cards;ui.sel=[];ui.active=null;afterStruct();toast(`${res.cards.length} cards importados da tabela`);
}
function exportTable(){
  if(typeof XLSX==='undefined'){toast('Biblioteca XLSX não carregou (sem internet?)');return}
  const rows=orderedCards().map((c,i)=>({Card:i+1,Categoria:catOf(c).name,Topo:c.top,Principal:c.main,'Rodapé':c.bottom,Lateral:c.side||'','Ícone':c.icon&&ICONS[c.icon]?ICONS[c.icon].n:''}));
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[8,24,26,18,28,22].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'EDITAR');
  XLSX.writeFile(wb,'cards_media_portal_tabela.xlsx');
}
